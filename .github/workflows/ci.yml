name: titan-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install . pytest

      - name: Unit + integration tests
        run: python -m pytest -q

      - name: Accuracy eval matrix
        run: titan eval accuracy

      - name: Deterministic e2e parity smoke
        run: python -m pytest -q tests/test_e2e_parity_cli.py
